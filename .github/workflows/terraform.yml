# .github/workflows/terraform.yml
# Provisions AWS foundation: S3 bucket, IAM roles, SageMaker sentiment endpoint
# Run this FIRST before any other deploy workflow
# See: CAPSTONE/docs/cicd-terraform.md

name: 1 — Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Plan only or apply changes"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="environment=${{ inputs.environment }}" -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Print Outputs
        if: inputs.action == 'apply'
        run: terraform output
