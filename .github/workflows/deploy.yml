# .github/workflows/deploy.yml
# Builds Docker images, pushes to GHCR, and rolls out to EKS
# Run AFTER terraform.yml and sagemaker-deploy.yml
# See: CAPSTONE/docs/cicd-deploy.md

name: 3 — Build & Roll Out to EKS

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "k8s/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to deploy"
        required: true
        type: choice
        options:
          - all
          - agent-service
          - churn-predictor
          - sentiment-predictor
          - frontend
        default: all
      tag:
        description: "Docker image tag"
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lumin33r

jobs:
  # ── Build & Push Docker Images ────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agent-service
            context: services/agent-service
          - name: churn-predictor
            context: services/churn-predictor-api
          - name: sentiment-predictor
            context: services/sentiment-analysis-api
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not selected
        id: check
        run: |
          if [[ "${{ inputs.service }}" != "all" && "${{ inputs.service }}" != "${{ matrix.name }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ inputs.tag }}

  # ── Deploy to EKS ────────────────────────────────────────────────
  deploy-to-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Ensure ALB Controller Ready
        run: |
          export AWS_REGION="${{ vars.AWS_REGION }}"
          bash ./scripts/ensure_alb_controller.sh

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/namespace-quota.yaml
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/deployments/

          for attempt in 1 2 3; do
            if kubectl apply -f k8s/services/; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Failed to apply services after 3 attempts"
              exit 1
            fi

            echo "Service apply failed, re-checking ALB webhook readiness before retry $((attempt + 1))..."
            export AWS_REGION="${{ vars.AWS_REGION }}"
            bash ./scripts/ensure_alb_controller.sh
          done

          for attempt in 1 2 3; do
            if kubectl apply -f k8s/ingress.yaml; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Failed to apply ingress after 3 attempts"
              exit 1
            fi

            echo "Ingress apply failed, re-checking ALB webhook readiness before retry $((attempt + 1))..."
            export AWS_REGION="${{ vars.AWS_REGION }}"
            bash ./scripts/ensure_alb_controller.sh
          done

      - name: Create secrets from GitHub secrets
        run: |
          kubectl create secret generic aws-secrets \
            -n retention-engine \
            --from-literal=AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --from-literal=LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete secret kube-secrets -n retention-engine --ignore-not-found
          kubectl create secret generic kube-secrets \
            -n retention-engine \
            --from-literal=username=admin \
            --from-literal=password=${{ secrets.KUBE_BASIC_AUTH_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Clean up failed pods
        run: |
          echo "Deleting pods in error states..."
          kubectl delete pods -n retention-engine --field-selector=status.phase=Failed --ignore-not-found
          for status in ImagePullBackOff ErrImagePull CrashLoopBackOff; do
            PODS=$(kubectl get pods -n retention-engine --no-headers 2>/dev/null | grep "$status" | awk '{print $1}')
            if [ -n "$PODS" ]; then
              echo "Deleting $status pods: $PODS"
              echo "$PODS" | xargs kubectl delete pod -n retention-engine --ignore-not-found
            fi
          done

      - name: Preflight cluster capacity
        run: |
          READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2 == "Ready" {count++} END {print count+0}')
          NOT_READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2 != "Ready" {count++} END {print count+0}')
          PENDING_PODS=$(kubectl -n retention-engine get pods --no-headers 2>/dev/null | awk '$3 == "Pending" {count++} END {print count+0}')

          echo "Ready nodes: $READY_NODES"
          echo "NotReady nodes: $NOT_READY_NODES"
          echo "Pending pods in retention-engine: $PENDING_PODS"

          if [ "$READY_NODES" -lt 3 ]; then
            echo "❌ Insufficient Ready nodes for safe rollout. Need at least 3 Ready nodes before restarting deployments."
            kubectl get nodes
            exit 1
          fi

          if [ "$PENDING_PODS" -gt 0 ]; then
            echo "❌ Cluster already has Pending pods in retention-engine. Refusing to start rollout while capacity is constrained."
            kubectl -n retention-engine get pods
            exit 1
          fi

      - name: Roll out deployments sequentially
        run: |
          for dep in agent-service churn-predictor sentiment-predictor frontend-deployment; do
            echo "Restarting $dep..."
            kubectl rollout restart deployment/$dep -n retention-engine || true
            echo "Waiting for $dep..."
            kubectl rollout status deployment/$dep -n retention-engine --timeout=300s
          done

      - name: Wait for public ALB
        id: alb
        run: |
          for i in $(seq 1 36); do
            ALB_URL=$(kubectl get ingress retention-engine-ingress -n retention-engine \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$ALB_URL" ]; then
              echo "hostname=$ALB_URL" >> "$GITHUB_OUTPUT"
              echo "ALB hostname assigned after $((i * 10))s: $ALB_URL"
              break
            fi
            echo "[$i/36] Waiting for ALB hostname..."
            sleep 10
          done

          if [ -z "${ALB_URL:-}" ]; then
            echo "❌ Timed out waiting for ALB hostname"
            kubectl describe ingress retention-engine-ingress -n retention-engine
            exit 1
          fi

          for i in $(seq 1 24); do
            if nslookup "$ALB_URL" >/dev/null 2>&1; then
              echo "DNS resolved after $((i * 10))s"
              exit 0
            fi
            echo "[$i/24] Waiting for ALB DNS propagation..."
            sleep 10
          done

          echo "❌ ALB hostname assigned but DNS did not resolve in time"
          exit 1

      - name: Smoke test public routes
        run: |
          BASE_URL="http://${{ steps.alb.outputs.hostname }}"
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/health" >/dev/null
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/agent-api/health" >/dev/null
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/churn-api/health" >/dev/null
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/sentiment-api/health" >/dev/null
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/agent-api/docs" >/dev/null
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/churn-api/docs" >/dev/null
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors "$BASE_URL/sentiment-api/docs" >/dev/null
          echo "✅ Public frontend and FastAPI routes are reachable via ALB"

      - name: Deployment Summary
        run: |
          ALB_URL="${{ steps.alb.outputs.hostname }}"
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ALB_URL" ]; then
            echo "### Public Endpoints" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Route | URL |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Frontend | http://${ALB_URL}/ |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Frontend Health | http://${ALB_URL}/health |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Agent API Health | http://${ALB_URL}/agent-api/health |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Agent API Docs | http://${ALB_URL}/agent-api/docs |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Agent Chat | http://${ALB_URL}/agent-api/chat |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Churn API Health | http://${ALB_URL}/churn-api/health |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Churn API Docs | http://${ALB_URL}/churn-api/docs |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Churn High Risk | http://${ALB_URL}/churn-api/high-risk?limit=5 |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Sentiment API Health | http://${ALB_URL}/sentiment-api/health |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Sentiment API Docs | http://${ALB_URL}/sentiment-api/docs |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Sentiment Predict | http://${ALB_URL}/sentiment-api/predict |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ALB not yet provisioned — check \`kubectl describe ingress -n retention-engine retention-engine-ingress\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ inputs.tag }}\`  " >> "$GITHUB_STEP_SUMMARY"
          echo "**Service:** \`${{ inputs.service }}\`" >> "$GITHUB_STEP_SUMMARY"
