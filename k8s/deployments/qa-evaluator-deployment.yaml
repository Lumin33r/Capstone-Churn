# k8s/deployments/qa-evaluator-deployment.yaml
# Runs Okino's QA Evaluator SageMaker wrapper service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-evaluator
  namespace: retention-engine
  labels:
    app: qa-evaluator
    team: retention-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qa-evaluator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: qa-evaluator
    spec:
      containers:
        - name: qa-evaluator
          image: ghcr.io/lumin33r/qa-evaluator:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aws-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"