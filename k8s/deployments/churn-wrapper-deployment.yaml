apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-wrapper-deployment
  namespace: retention-engine

spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-wrapper-deployment
  template:
    metadata:
      labels:
        app: churn-wrapper-deployment

    spec:
      containers:
        - name: churn-wrapper-deployment
          image: ghcr.io/lumin33r/backend:latest
          ports:
            - containerPort: 8000             
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            timeoutSeconds: 1
            successThreshold: 1
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
