# k8s/deployments/sentiment-predictor-deployment.yaml
# Runs Okino's QA Evaluator SageMaker wrapper service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-predictor
  namespace: retention-engine
  labels:
    app: sentiment-predictor
    team: retention-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-predictor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: sentiment-predictor
    spec:
      containers:
        - name: sentiment-predictor
          image: ghcr.io/lumin33r/sentiment-predictor:latest
          ports:
            - containerPort: 8002
          env:
            - name: FASTAPI_ROOT_PATH
              value: /sentiment-api
            - name: SENTIMENT_ENDPOINT_NAME
              value: retention-sentiment-analysis-endpoint
          envFrom:
            - secretRef:
                name: aws-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
