# k8s/deployments/agent-deployment.yaml
# Tells Kubernetes to run the LangChain agent service container
# readinessProbe: waits until /health returns 200 before sending traffic
# livenessProbe: restarts the container if /health stops returning 200
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: retention-engine
  labels:
    app: agent-service
    team: retention-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: ghcr.io/lumin33r/agent-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: aws-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"