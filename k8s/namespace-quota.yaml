# k8s/namespace-quota.yaml
# Limits total resource usage in the retention-engine namespace
# Prevents one service from consuming all cluster resources (bonus points)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: retention-engine-quota
  namespace: retention-engine
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: retention-engine-limits
  namespace: retention-engine
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"