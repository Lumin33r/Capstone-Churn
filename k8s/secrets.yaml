# k8s/secret.yaml
# Creates an isolated space in Kubernetes that contains secrets
# Limits access and scope within the Kubernetes namespace

# Caution:

# Kubernetes Secrets are, by default, stored unencrypted in the API server's underlying
# data store (etcd). Anyone with API access can retrieve or modify a Secret, and so can
# anyone with access to etcd. Additionally, anyone who is authorized to create a Pod in
# a namespace can use that access to read any Secret in that namespace; this includes
# indirect access such as the ability to create a Deployment.

apiVersion: v1
kind: Secret
metadata:
  name: kube-secrets
  namespace: retention-engine
# TODO: will or not be changed, may not be necessary for simple project
type: kubernetes.io/basic-auth
stringData:
  username: admin # required field for kubernetes.io/basic-auth
  password: t0p-Secret # required field for kubernetes.io/basic-auth

---
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
  namespace: retention-engine
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
